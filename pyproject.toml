[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-branch-agent"
version = "0.1.0"
description = "Persistent OpenAI Agents SDK harness for interactive screenplays"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.22.2", "openai==3.14.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary,pool]>=3.2,<4", "jsonschema>=4.23,<5", "python-dotenv>=1,<2", "python-multipart>=0.0.20", "python-docx>=1.1,<2", "tiktoken>=0.9,<1", "itsdangerous>=2.2,<3", "httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["branch_agent*"]
[tool.setuptools.package-data]
branch_agent = ["static/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
